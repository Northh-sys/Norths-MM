<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Stock — North's MM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .live-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
  .live-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #4ade80; background: rgba(34, 197, 94, 0.1); padding: 6px 14px; border-radius: 20px; font-weight: 600; }
  .pulse { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 10px #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .search-bar { width: 100%; padding: 16px 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); color: white; font-family: inherit; font-size: 1rem; margin-bottom: 32px; outline: none; transition: border-color 0.3s; }
  .search-bar:focus { border-color: var(--accent); }
  .loading-spinner { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 1.1rem; }
  .item-updated { font-size: 0.7rem; color: var(--text-muted); margin-top: 8px; text-align: right; width: 100%; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
</style>
</head>
<body>
<div class="glow glow-top"></div>
<header>
  <div class="header-inner">
    <a href="index.html" class="brand"><div class="brand-icon">N</div> North's MM</a>
    <button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button>
  </div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-links">
    <a href="index.html">Home</a>
    <a href="middleman.html">Middleman Services</a>
    <a href="limiteds.html">Buy Limiteds</a>
    <a href="stock.html" class="current">Stock</a>
    <a href="reviews.html">Reviews</a>
    <a href="https://discord.gg/HAw3NcDvKu" class="highlight">Discord Server</a>
    <a href="faq.html">FAQ</a>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="live-header">
      <div>
        <h2 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 8px;">Live Market Stock</h2>
        <p style="color: var(--text-muted);">Updated automatically every hour.</p>
      </div>
      <div class="live-status">
        <div class="pulse"></div> Data Synced
      </div>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search keywords (e.g., Headless, Dominus, Valk)...">
    
    <div id="marketGrid" class="market-grid">
      <div class="loading-spinner">Loading live data...</div>
    </div>
    
    <div class="stock-cta">
      <a href="https://discord.gg/HAw3NcDvKu" class="btn btn-primary">Open Ticket to Buy</a>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 16px;">USD estimates based on standard rate.</p>
    </div>
  </div>
</main>

<footer><div class="wrap"><p>© 2025 North's MM. All rights reserved.</p></div></footer>
<script src="script.js"></script>

<script>
  const ROUBUX_TO_USD_RATE = 0.0038; 
  let allItems = [];

  async function loadData() {
    try {
      // Read the file generated by GitHub Actions
      const response = await fetch('data.json');
      const data = await response.json();
      
      allItems = data.map(item => ({
        name: item.name,
        rap: item.rap,
        usd: (item.rap * ROUBUX_TO_USD_RATE).toFixed(2)
      }));
      
      renderGrid(allItems);
    } catch (e) {
      document.getElementById('marketGrid').innerHTML = '<div class="loading-spinner">Data file is generating. Please wait 1 minute and refresh.</div>';
    }
  }

  function renderGrid(items) {
    const grid = document.getElementById('marketGrid');
    const now = new Date().toLocaleString();

    if (items.length === 0) {
      grid.innerHTML = '<div class="loading-spinner">No items found matching that keyword.</div>';
      return;
    }

    grid.innerHTML = items.map(item => `
      <div class="market-item">
        <div class="item-info">
          <h3>${item.name}</h3>
          <div class="rap">RAP: ${item.rap.toLocaleString()} R$</div>
        </div>
        <div class="item-price">
          <div class="usd">~$${Number(item.usd).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
          <div class="robux">USD Est.</div>
        </div>
        <div class="item-updated">Last updated: ${now}</div>
      </div>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const searchTerm = e.target.value.toLowerCase().trim();
    if (searchTerm === '') {
      renderGrid(allItems);
      return;
    }
    const filtered = allItems.filter(item => item.name.toLowerCase().includes(searchTerm));
    renderGrid(filtered);
  });

  // Start
  loadData();
</script>
</body>
</html>
